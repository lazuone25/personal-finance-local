<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Authorization Callback</title>
</head>
<body>
  <h2>Authorization complete</h2>
  <p id="msg">Se redirectioneaza catre aplicatie...</p>
  <script>
    const params = window.location.search;
    if (params) {
      window.location.href = "http://localhost:8000/api/auth/callback" + params;
    } else {
      document.getElementById("msg").textContent = "Niciun parametru primit de la banca.";
    }
  </script>
</body>
</html>
